<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="'Segoe UI','Yu Gothic UI','Hiragino Sans',sans-serif">
  <style>
    .req { font-size: 10px; fill: #8e44ad; font-weight: bold; }
    .leader { stroke: #8e44ad; stroke-width: 1; stroke-dasharray: 3 3; fill: none; opacity: 0.6; }
    .log { font-size: 12px; }
  </style>

  <!-- 背景 -->
  <rect x="0" y="0" width="1000" height="620" fill="#f5f6f8"/>

  <!-- ブラウザウィンドウ -->
  <rect x="20" y="20" width="960" height="580" rx="8" fill="#ffffff" stroke="#c4c9d0"/>
  <rect x="20" y="20" width="960" height="36" rx="8" fill="#e8eaed"/>
  <rect x="20" y="42" width="960" height="14" fill="#e8eaed"/>
  <circle cx="42" cy="38" r="5" fill="#e74c3c"/>
  <circle cx="60" cy="38" r="5" fill="#f1c40f"/>
  <circle cx="78" cy="38" r="5" fill="#2ecc71"/>
  <rect x="110" y="27" width="300" height="22" rx="11" fill="#ffffff" stroke="#d0d4da"/>
  <text x="124" y="42" font-size="12" fill="#666">http://localhost:3000</text>

  <!-- アプリヘッダ -->
  <rect x="20" y="56" width="960" height="48" fill="#55c500"/>
  <text x="40" y="86" font-size="18" font-weight="bold" fill="#ffffff">Qiita記事バックアップツール</text>
  <rect x="660" y="68" width="200" height="24" rx="12" fill="#ffffff"/>
  <circle cx="676" cy="80" r="5" fill="#55c500"/>
  <text x="688" y="84" font-size="12" fill="#3d8b1f">接続済(@nagura)</text>

  <!-- ① 実行中パネル -->
  <text x="40" y="136" font-size="13" font-weight="bold" fill="#5a6472">① 実行中の表示</text>
  <rect x="40" y="146" width="430" height="410" rx="8" fill="#ffffff" stroke="#d0d4da"/>
  <text x="60" y="180" font-size="16" font-weight="bold" fill="#333">バックアップ実行中…</text>

  <!-- 進捗バー (F-BK-09) -->
  <rect x="60" y="198" width="390" height="16" rx="8" fill="#e8eaed"/>
  <rect x="60" y="198" width="234" height="16" rx="8" fill="#55c500"/>
  <text x="60" y="236" font-size="12" fill="#333">12 / 20 件(60%)</text>
  <text x="60" y="260" font-size="12" fill="#333">現在処理中: Docker Composeで開発環境を整える</text>
  <path class="leader" d="M 452 206 L 464 206"/>
  <text x="408" y="192" class="req">F-BK-09</text>

  <!-- 中断ボタン (F-BK-10) -->
  <rect x="60" y="278" width="100" height="32" rx="6" fill="#ffffff" stroke="#c0392b"/>
  <text x="110" y="299" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">中断</text>
  <path class="leader" d="M 162 294 L 184 294"/>
  <text x="188" y="298" class="req">F-BK-10</text>

  <!-- 実行ログ -->
  <rect x="60" y="326" width="390" height="180" rx="4" fill="#f8f9fa" stroke="#e0e3e8"/>
  <text x="74" y="352" class="log" fill="#3d8b1f">✓ Reactで作るローカルWebツール入門 … 完了</text>
  <text x="74" y="378" class="log" fill="#3d8b1f">✓ TypeScriptの型パズル練習帳 … 完了</text>
  <text x="74" y="404" class="log" fill="#b96b00">✓ PowerShellスクリプト小技集 … 完了(画像1件失敗)</text>
  <text x="74" y="430" class="log" fill="#c0392b">✕ Qiita API v2の使い方まとめ … 失敗(リトライ上限)</text>
  <text x="74" y="456" class="log" fill="#5a6472">▶ Docker Composeで開発環境を整える … 処理中</text>
  <text x="74" y="492" font-size="10.5" fill="#999">※ 中断しても完了済みの記事のバックアップは保持されます(F-BK-10)</text>

  <text x="60" y="540" font-size="11" fill="#aaa">レート制限を考慮したアクセス間隔・リトライ制御(F-BK-12 / N-PERF-02)</text>

  <!-- ② 完了後パネル -->
  <text x="510" y="136" font-size="13" font-weight="bold" fill="#5a6472">② 完了後の表示(結果サマリ)</text>
  <rect x="510" y="146" width="450" height="410" rx="8" fill="#ffffff" stroke="#d0d4da"/>
  <text x="530" y="180" font-size="16" font-weight="bold" fill="#333">バックアップ完了</text>

  <!-- 結果タイル -->
  <rect x="530" y="198" width="128" height="56" rx="6" fill="#f5f6f8"/>
  <text x="544" y="218" font-size="11" fill="#666">対象</text>
  <text x="544" y="242" font-size="18" font-weight="bold" fill="#333">20 件</text>
  <rect x="670" y="198" width="128" height="56" rx="6" fill="#e6f4e0"/>
  <text x="684" y="218" font-size="11" fill="#3d8b1f">成功</text>
  <text x="684" y="242" font-size="18" font-weight="bold" fill="#3d8b1f">19 件</text>
  <rect x="810" y="198" width="128" height="56" rx="6" fill="#fdeaea"/>
  <text x="824" y="218" font-size="11" fill="#c0392b">失敗</text>
  <text x="824" y="242" font-size="18" font-weight="bold" fill="#c0392b">1 件</text>

  <!-- 画像取得失敗一覧 (F-BK-08) -->
  <text x="530" y="292" font-size="13" font-weight="bold" fill="#333">画像取得失敗一覧(2件)</text>
  <path class="leader" d="M 700 288 L 720 288"/>
  <text x="724" y="292" class="req">F-BK-08</text>
  <rect x="530" y="302" width="410" height="118" fill="#ffffff" stroke="#d0d4da"/>
  <rect x="530" y="302" width="410" height="30" fill="#f2f3f5"/>
  <text x="544" y="322" font-size="11.5" font-weight="bold" fill="#5a6472">記事</text>
  <text x="724" y="322" font-size="11.5" font-weight="bold" fill="#5a6472">画像</text>
  <text x="856" y="322" font-size="11.5" font-weight="bold" fill="#5a6472">理由</text>
  <line x1="530" y1="376" x2="940" y2="376" stroke="#eceef1"/>
  <text x="544" y="358" font-size="11.5" fill="#333">PowerShellスクリプト小技集</text>
  <text x="724" y="358" font-size="11.5" fill="#333">003_capture.png</text>
  <text x="856" y="358" font-size="11.5" fill="#c0392b">HTTP 404</text>
  <text x="544" y="402" font-size="11.5" fill="#333">PowerShellスクリプト小技集</text>
  <text x="724" y="402" font-size="11.5" fill="#333">005_diagram.png</text>
  <text x="856" y="402" font-size="11.5" fill="#c0392b">タイムアウト</text>

  <text x="530" y="446" font-size="11" fill="#888">※ 取得に失敗した画像の参照は、元のQiita上のURLのまま保存されています</text>

  <!-- 戻るボタン -->
  <rect x="530" y="470" width="160" height="34" rx="6" fill="#55c500"/>
  <text x="610" y="492" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">記事一覧へ戻る</text>
  <text x="530" y="540" font-size="11" fill="#aaa">実行結果は履歴に記録されます(F-ST-06)</text>
</svg>
