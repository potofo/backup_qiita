<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="'Segoe UI','Yu Gothic UI','Hiragino Sans',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6472"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d8b1f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="36" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Qiita記事バックアップツール システム構成図(外部要件書ベース)</text>

  <!-- ローカルPC 境界 -->
  <rect x="40" y="60" width="640" height="490" rx="10" fill="#f8fafc" stroke="#9aa4b0" stroke-dasharray="8 5"/>
  <text x="60" y="88" font-size="13" font-weight="bold" fill="#5a6472">ローカルPC(Windows 11)</text>

  <!-- インターネット 境界 -->
  <rect x="720" y="60" width="240" height="490" rx="10" fill="#fbfdf9" stroke="#9aa4b0" stroke-dasharray="8 5"/>
  <text x="740" y="88" font-size="13" font-weight="bold" fill="#5a6472">インターネット</text>

  <!-- Webブラウザ -->
  <rect x="70" y="120" width="180" height="110" rx="8" fill="#ffffff" stroke="#5a6472" stroke-width="1.5"/>
  <text x="160" y="146" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">Webブラウザ</text>
  <text x="160" y="168" font-size="11" fill="#666" text-anchor="middle">Web UI(3画面)</text>
  <text x="160" y="186" font-size="10.5" fill="#888" text-anchor="middle">接続確認 / ダッシュボード</text>
  <text x="160" y="202" font-size="10.5" fill="#888" text-anchor="middle">実行状況表示</text>

  <!-- バックアップツール本体 -->
  <rect x="310" y="110" width="200" height="180" rx="8" fill="#e6f4e0" stroke="#55c500" stroke-width="2"/>
  <text x="410" y="136" font-size="13" font-weight="bold" fill="#2d6a12" text-anchor="middle">バックアップツール</text>
  <text x="410" y="154" font-size="11" fill="#3d8b1f" text-anchor="middle">ローカルWebサーバ</text>
  <line x1="330" y1="164" x2="490" y2="164" stroke="#a5d68a"/>
  <text x="330" y="184" font-size="10.5" fill="#333">・接続確認(トークン検証)</text>
  <text x="330" y="202" font-size="10.5" fill="#333">・記事一覧取得・状態管理</text>
  <text x="330" y="220" font-size="10.5" fill="#333">・バックアップ実行(全件/差分/選択)</text>
  <text x="330" y="238" font-size="10.5" fill="#333">・画像取得・相対パス書き換え</text>
  <text x="330" y="256" font-size="10.5" fill="#333">・世代管理(Git自動コミット)</text>
  <text x="330" y="278" font-size="10" fill="#888">待ち受けは localhost のみ</text>

  <!-- .env -->
  <rect x="70" y="300" width="180" height="80" rx="8" fill="#fff8dd" stroke="#c4a900" stroke-width="1.5"/>
  <text x="160" y="326" font-size="12.5" font-weight="bold" fill="#6b5900" text-anchor="middle">.env</text>
  <text x="160" y="346" font-size="10.5" fill="#6b5900" text-anchor="middle">QIITA_ACCESS_TOKEN</text>
  <text x="160" y="364" font-size="10" fill="#8f7500" text-anchor="middle">(スコープ: read_qiita)</text>

  <!-- backupフォルダ -->
  <rect x="310" y="340" width="340" height="190" rx="8" fill="#ffffff" stroke="#5a6472" stroke-width="1.5"/>
  <text x="330" y="366" font-size="12.5" font-weight="bold" fill="#333">backup/(独立Gitリポジトリ = 世代管理)</text>
  <text x="340" y="388" font-size="10.5" fill="#555">├ .git/ … Run単位で自動コミット(push禁止)</text>
  <text x="340" y="406" font-size="10.5" fill="#555">├ index.json … 状態管理(5状態の判定元)</text>
  <text x="340" y="424" font-size="10.5" fill="#555">└ {タイトル}_{記事ID}/ … 記事フォルダ</text>
  <text x="360" y="442" font-size="10.5" fill="#777">├ 記事タイトル.md … 閲覧用(画像相対パス)</text>
  <text x="360" y="460" font-size="10.5" fill="#777">├ original.md … 取得原文</text>
  <text x="360" y="478" font-size="10.5" fill="#777">├ meta.json … メタ情報・反応数</text>
  <text x="360" y="496" font-size="10.5" fill="#777">└ images/ … ダウンロード画像</text>
  <text x="330" y="518" font-size="10" fill="#888">Markdownビューワでそのまま閲覧可能</text>

  <!-- Qiita API -->
  <rect x="750" y="120" width="180" height="120" rx="8" fill="#e6f4e0" stroke="#55c500" stroke-width="1.5"/>
  <text x="840" y="146" font-size="13" font-weight="bold" fill="#2d6a12" text-anchor="middle">Qiita API v2</text>
  <text x="840" y="168" font-size="10" fill="#3d8b1f" text-anchor="middle">GET /authenticated_user</text>
  <text x="840" y="186" font-size="10" fill="#3d8b1f" text-anchor="middle">GET /authenticated_user/items</text>
  <text x="840" y="208" font-size="10" fill="#888" text-anchor="middle">レート制限 1,000回/時</text>
  <text x="840" y="224" font-size="10" fill="#888" text-anchor="middle">限定共有記事も取得可</text>

  <!-- 画像ホスト -->
  <rect x="750" y="300" width="180" height="100" rx="8" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.5"/>
  <text x="840" y="326" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">画像ホスト</text>
  <text x="840" y="348" font-size="9.5" fill="#666" text-anchor="middle">camo.qiitausercontent.com</text>
  <text x="840" y="366" font-size="9.5" fill="#666" text-anchor="middle">qiita-image-store.s3.*</text>
  <text x="840" y="386" font-size="10" fill="#888" text-anchor="middle">認証不要</text>

  <!-- 矢印: ブラウザ ⇔ ツール -->
  <line x1="250" y1="165" x2="310" y2="165" stroke="#5a6472" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="280" y="152" font-size="10" fill="#5a6472" text-anchor="middle">HTTP</text>

  <!-- 矢印: .env → ツール -->
  <path d="M 250 340 L 280 340 L 280 250 L 310 250" fill="none" stroke="#c4a900" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="266" y="300" font-size="10" fill="#8f7500" text-anchor="middle" transform="rotate(-90 266 300)">トークン読込</text>

  <!-- 矢印: Qiita → ツール(単方向取得) -->
  <line x1="750" y1="170" x2="510" y2="170" stroke="#3d8b1f" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="630" y="158" font-size="10.5" font-weight="bold" fill="#3d8b1f" text-anchor="middle">記事一覧+本文(raw Markdown)</text>
  <text x="630" y="188" font-size="9.5" fill="#5a6472" text-anchor="middle">HTTPS / Authorization: Bearer(読み取り専用)</text>

  <!-- 矢印: 画像ホスト → ツール -->
  <path d="M 750 350 L 690 350 L 690 240 L 510 240" fill="none" stroke="#5a6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="628" y="228" font-size="10" fill="#5a6472" text-anchor="middle">画像GET(認証ヘッダなし)</text>

  <!-- 矢印: ツール → backup -->
  <line x1="410" y1="290" x2="410" y2="340" stroke="#3d8b1f" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="490" y="318" font-size="10.5" font-weight="bold" fill="#3d8b1f" text-anchor="middle">保存+自動コミット</text>

  <!-- 単方向の注記 -->
  <rect x="40" y="570" width="920" height="36" rx="6" fill="#f2f7ee"/>
  <text x="500" y="593" font-size="11.5" fill="#2d6a12" text-anchor="middle">バックアップの方向は Qiita → ローカル の単方向(書き込み系APIは使用しない)。パスワード・2FAは扱わず、トークン発行時にユーザがブラウザ上で認証する。</text>
</svg>
